apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────────
// Läs från android/keystore.properties om den finns (lokal, gitignorerad).
// Annars från miljövariabler (CI/CD eller mac-terminal).
// Committa ALDRIG keystore.properties, *.jks eller lösenord.
def keystorePropsFile = rootProject.file("keystore.properties")
def ks = new Properties()
def hasFileSigningConfig  = keystorePropsFile.exists()
def hasEnvSigningConfig   = System.getenv('VINDKOLLEN_STORE_FILE') != null

if (hasFileSigningConfig) {
    ks.load(new FileInputStream(keystorePropsFile))
} else if (hasEnvSigningConfig) {
    ks['storeFile']     = System.getenv('VINDKOLLEN_STORE_FILE')
    ks['storePassword'] = System.getenv('VINDKOLLEN_STORE_PASSWORD') ?: ''
    ks['keyAlias']      = System.getenv('VINDKOLLEN_KEY_ALIAS')      ?: ''
    ks['keyPassword']   = System.getenv('VINDKOLLEN_KEY_PASSWORD')   ?: ''
}
def hasSigningConfig = hasFileSigningConfig || hasEnvSigningConfig

android {
    namespace = "se.catchme.vindkollen"
    compileSdk = rootProject.ext.compileSdkVersion   // 36

    defaultConfig {
        applicationId "se.catchme.vindkollen"
        minSdkVersion    rootProject.ext.minSdkVersion    // 24
        targetSdkVersion rootProject.ext.targetSdkVersion // 36
        // Google Play har redan tagit emot versionCode 4. Varje ny AAB måste
        // ha ett högre, unikt nummer.
        versionCode  5
        versionName  "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile     file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias      ks['keyAlias']
                keyPassword   ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable      false
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
